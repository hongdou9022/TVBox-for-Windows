# 说明：
#  - CNB 组织固定为 floatedcloud（可用 CNB_GROUP 覆盖）；4 个仓均为已建好的私有空仓。
#  - CNB 仓库名按实际创建结果：cloudtv_android / cloudtv_go / cloudtv_js / cloudtv_win。
